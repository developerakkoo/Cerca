<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab5"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Frequently Asked Questions
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="support-page-content">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">FAQ</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Search Bar -->
  <div class="search-container">
    <ion-searchbar
      [(ngModel)]="searchQuery"
      (ionInput)="onSearchChange($event)"
      placeholder="Search questions..."
      show-clear-button="focus"
      debounce="300"
      class="faq-searchbar">
    </ion-searchbar>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredCategories.length === 0" class="support-empty-state faq-empty-state">
    <div class="support-icon-box">
      <ion-icon name="search-outline"></ion-icon>
    </div>
    <h3>No results found</h3>
    <p>Try searching with different keywords</p>
    <ion-button fill="outline" mode="ios" (click)="clearSearch()" class="support-action-btn">
      Clear Search
    </ion-button>
  </div>

  <!-- FAQ Categories -->
  <div *ngIf="filteredCategories.length > 0" class="faq-container">
    <div *ngFor="let category of filteredCategories; let categoryIndex = index" class="faq-category">
      <!-- Category Header -->
      <div class="category-header">
        <div class="support-icon-box">
          <ion-icon [name]="category.icon"></ion-icon>
        </div>
        <h2 class="category-title">{{ category.title }}</h2>
      </div>

      <!-- FAQ Items -->
      <div class="faq-items">
        <div
          *ngFor="let item of category.items; let itemIndex = index"
          class="support-card faq-item"
          [class.expanded]="isExpanded(categoryIndex, itemIndex)">

          <!-- Question -->
          <div
            class="faq-question"
            (click)="toggleItem(categoryIndex, itemIndex)">
            <span class="question-text">{{ item.question }}</span>
            <ion-icon
              [name]="isExpanded(categoryIndex, itemIndex) ? 'chevron-up-outline' : 'chevron-down-outline'"
              class="expand-icon">
            </ion-icon>
          </div>

          <!-- Answer -->
          <div
            class="faq-answer"
            [class.show]="isExpanded(categoryIndex, itemIndex)">
            <p>{{ item.answer }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Help Section -->
  <div class="help-section">
    <div class="support-card help-card">
      <div class="help-card-body">
        <div class="support-icon-box">
          <ion-icon name="chatbubbles-outline"></ion-icon>
        </div>
        <h3>Still need help?</h3>
        <p>Can't find what you're looking for? Contact our support team for assistance.</p>
        <ion-button expand="block" fill="outline" mode="ios" (click)="contactSupport()" class="support-action-btn help-contact-btn">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          Contact Support
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
