<ion-header [translucent]="true" class="ion-no-border cab-searching-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Searching For Drivers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="cab-searching-content">
  <!-- Searching UI -->
  <div class="searching-container" *ngIf="!showNoDriverFound">
    <div class="status-container">
      <h2>Searching Ride...</h2>
      <p class="status-subtext">This may take a few seconds...</p>
    </div>

    <div class="animation-container" #animationContainer>
      <div class="radar-ring ring-1"></div>
      <div class="radar-ring ring-2"></div>
      <div class="radar-ring ring-3"></div>
      <div class="radar-ring ring-4"></div>
      <div class="radar-ring ring-5"></div>

      <div class="car-orbit car-orbit--a" aria-hidden="true">
        <img src="assets/cab-search/car-top.svg" alt="" class="car-marker" />
      </div>
      <div class="car-orbit car-orbit--b" aria-hidden="true">
        <img src="assets/cab-search/car-top.svg" alt="" class="car-marker" />
      </div>

      <div class="profile-container">
        <img src="assets/logo.svg" alt="Cerca" class="profile-image" />
      </div>
    </div>

    <div class="slide-to-cancel-container">
      <div class="slide-to-cancel" #slideTrack>
        <div class="slide-handle" #slideHandle></div>
        <div class="slide-text">Slide to Cancel &gt;&gt;</div>
      </div>
    </div>
  </div>

  <!-- No Driver Found UI -->
  <div class="no-driver-container" *ngIf="showNoDriverFound">
    <div class="no-driver-content">
      <div class="icon-container">
        <div class="icon-circle">
          <ion-icon name="car-outline" class="icon"></ion-icon>
        </div>
      </div>

      <div class="message-container">
        <h2>No Drivers Available</h2>
        <p class="message-text">{{ noDriverMessage }}</p>
      </div>

      <div class="button-container">
        <ion-button
          expand="block"
          color="primary"
          class="back-button"
          (click)="goBack()">
          <ion-icon name="arrow-back" slot="start"></ion-icon>
          Go Back
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
